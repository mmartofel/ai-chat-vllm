apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-vllm
  namespace: ${NAMESPACE}
  labels:
    app: embed-vllm
    app.kubernetes.io/component: embed-vllm
    app.kubernetes.io/name: embed-vllm
    app.kubernetes.io/part-of: RAG_SUBSYSTEM
    app.openshift.io/runtime: golang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embed-vllm
  template:
    metadata:
      labels:
        app: embed-vllm
    spec:
      serviceAccountName: embed-vllm-sa
      securityContext:
        runAsUser: 0
      enableServiceLinks: false
      initContainers:
        - name: model-downloader
          image: ${RHIIS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MODEL_DIR=${MODEL_PATH}
              if [ ! -f "${MODEL_DIR}/config.json" ]; then
                echo "Downloading ${MODEL_ID} from Hugging Face Hub..."
                huggingface-cli download ${MODEL_ID} \
                  --local-dir "${MODEL_DIR}" \
                  --local-dir-use-symlinks False
                echo "Download complete."
                ls -alh ${MODEL_DIR}
              else
                echo "Model already present at ${MODEL_DIR}, skipping download."
              fi
              echo "Warming HF modules cache for custom model code..."
              python3 -c "
              from transformers import AutoConfig
              AutoConfig.from_pretrained('${MODEL_DIR}', trust_remote_code=True)
              print('Modules cache warm.')
              "
              echo "Init complete."
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HF_HOME
              value: ${HF_DIR}/.hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
          volumeMounts:
            - name: models-cache
              mountPath: ${HF_DIR}
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      containers:
        - name: server
          image: ${RHIIS_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - ${MODEL_PATH}
            - --served-model-name
            - ${MODEL_ID}
            - --runner
            - pooling
            - --dtype
            - float32
            - --max-num-seqs
            - "64"
            - --max-model-len
            - "2048"
            - --enforce-eager
            - --trust-remote-code
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HF_HOME
              value: ${HF_DIR}/.hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "0.5"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: models-cache
              mountPath: ${HF_DIR}
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 24
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 10
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: embed-vllm-models-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
